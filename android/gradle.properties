org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=384m
android.useAndroidX=true
android.enableJetifier=true
kotlin.version=2.1.0
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false
skipDependencyChecks=true
# Los .jar del motor de Flutter no usan Support Library: Jetifier se queda sin
# memoria al transformarlos en CI (Java heap space). Se excluyen.
android.jetifier.ignorelist=arm64_v8a_.*,armeabi_v7a_.*,x86_64_.*,flutter_embedding_.*
