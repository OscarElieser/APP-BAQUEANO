# ============================================================================
# 🧭 BAQUEANO — ENTREGABLES PÚBLICOS CONTROLADOS
# ============================================================================
# 🎯 POR QUÉ: publicar el instalable Android sin habilitar descargas arbitrarias.
# ⚙️ CÓMO: una ubicación exacta precede al bloqueo general de extensiones APK.
# 📦 QUÉ: descarga estable `/downloads/baqueano-android.apk` con MIME y nombre; `/app` lleva a
#    `/descargar` (descargar.html, servida por try_files $uri.html en baqueano.conf).
# ============================================================================

location = /downloads/baqueano-android.apk {
    include /etc/nginx/snippets/baqueano-security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header Content-Disposition 'attachment; filename="baqueano-android.apk"' always;
    default_type application/vnd.android.package-archive;
    try_files /downloads/baqueano-android.apk =404;
}


# Alias corto para compartir: siempre la página de descarga, nunca el archivo directo.
location = /app {
    return 301 /descargar;
}
