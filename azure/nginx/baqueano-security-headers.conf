# =====================================================
# BAQUEANO — Cabeceras de seguridad HTTP (Nginx)
# =====================================================
# PROPÓSITO: replicar en Azure las mismas cabeceras que Firebase Hosting
#   (firebase.json) y Hostinger (website/.htaccess), para que el sitio tenga la
#   misma protección sin importar desde dónde se sirva.
# ARQUITECTURA: se incluye con `include` dentro de cada bloque `location` porque
#   en Nginx un `add_header` dentro de un location anula los heredados del server.
# SEGURIDAD: la CSP conserva 'unsafe-inline' porque el sitio actual usa scripts y
#   estilos en línea; retirarlo es la tarea P2 de docs/audit/SECURITY_AUDIT.md.
# RELACIÓN: si cambias la CSP aquí, cámbiala también en firebase.json y .htaccess.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# HSTS solo tiene efecto sobre HTTPS; se activa de verdad tras enable-https.sh.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://apis.google.com https://www.googletagmanager.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.openstreetmap.org https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.arcgisonline.com https://*.cartocdn.com https://images.unsplash.com https://video-previews.elements.envatousercontent.com; connect-src 'self' https://api.open-meteo.com https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://*.google.com https://*.arcgisonline.com https://app-baqueano.web.app; frame-src https://app-baqueano.firebaseapp.com; object-src 'none'; base-uri 'self';" always;
