# =====================================================
# BAQUEANO — Sitio Nginx de producción (Azure)
# =====================================================
#
# PROPÓSITO:
#   Servir el Website estático de BAQUEANO en baqueanonicaragua.com desde la VM
#   de Azure, con las mismas rutas, redirecciones y cabeceras que Firebase Hosting.
#
# ARQUITECTURA:
#   - root = /var/www/baqueano/current (enlace simbólico a la release activa,
#     creado por azure/deploy.sh). Cambiar de release es atómico.
#   - Este archivo arranca solo en el puerto 80. azure/enable-https.sh ejecuta
#     Certbot, que añade "listen 443 ssl" y la redirección 80 → 443 aquí mismo.
#   - /api/* se reenvía a la Cloud Function de Firebase mientras la API propia
#     de Azure (lote P1-8) no exista. Así el Website funciona igual que en web.app.
#
# SEGURIDAD:
#   - Sin listado de directorios; archivos ocultos (.git, .env, .htaccess) bloqueados.
#   - admin.html: noindex + sin caché. La autorización real la hacen Firebase Auth
#     y las reglas de Firestore, no el servidor web.
#
# RELACIÓN:
#   azure/nginx/baqueano-security-headers.conf, website/.htaccess, firebase.json.
# =====================================================

# --- www → dominio principal (canonical: https://baqueanonicaragua.com) ---
# Certbot añade TLS también a este bloque; la redirección se conserva en 443.
server {
    listen 80;
    listen [::]:80;
    server_name www.baqueanonicaragua.com;
    server_tokens off;
    return 301 https://baqueanonicaragua.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name baqueanonicaragua.com;

    root /var/www/baqueano/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    # Videos y medios grandes: límite de subida irrelevante (sitio estático),
    # pero se acotan cuerpos de petición para reducir abuso.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    error_page 404 /404.html;

    # --- Redirecciones heredadas (idénticas a firebase.json y .htaccess) ---
    location = /baqueano-ai      { return 301 /baqueano-ai.html; }
    location = /negocio          { return 301 /mi-negocio.html; }
    location = /mapa             { return 301 /mapa.html; }
    location = /ops              { return 301 /admin.html; }
    location = /privacidad       { return 302 /index.html#privacidad; }
    location = /terminos         { return 302 /index.html#terminos; }
    location ~ ^/departamentos(\.html)?/?$ { return 302 /departamento.html; }

    # --- Prueba pública de "no localhost" para el jurado ---
    # deploy.sh escribe health.json con el commit de GitHub desplegado.
    location = /health {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files /health.json =404;
    }

    include /etc/nginx/snippets/baqueano-delivery.conf;

    include /etc/nginx/snippets/baqueano-auth-proxy.conf;

    # --- API propia de Azure (Node en 127.0.0.1:3000, puerto nunca expuesto) ---
    # Prefijo más largo que /api/, por eso Nginx lo elige primero.
    location /api/azure/ {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        limit_except GET HEAD POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # --- API: proxy temporal a Firebase Functions (misma ruta que web.app) ---
    location /api/ {
        proxy_pass https://app-baqueano.web.app;
        proxy_set_header Host app-baqueano.web.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Bloquear archivos ocultos y artefactos que nunca deben servirse ---
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(md|log|apk|aab|map)$ { deny all; return 404; }

    # --- Ops Center ---
    location = /admin.html {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # --- Service Worker y manifest: nunca cachear largo ---
    location = /service-worker.js {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.json {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        default_type application/manifest+json;
    }

    # --- Imágenes y medios: caché de 7 días (igual que Hostinger) ---
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm|mp3|ogg)$ {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- JS/CSS: revalidar (nombres versionados con ?v=, ver PERFORMANCE_AUDIT) ---
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # --- HTML y resto ---
    location / {
        include /etc/nginx/snippets/baqueano-security-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
