# ============================================================================
# 🧭 BAQUEANO — ACCESO CANÓNICO DESDE LA IP PÚBLICA DE AZURE
# ============================================================================
#
# 🎯 POR QUÉ (WHY / PROPÓSITO):
# - Permitir que cualquier navegador que abra la IP pública llegue al Website,
#   sin duplicar contenido ni servir una página predeterminada de Nginx.
#
# ⚙️ CÓMO (HOW / ARQUITECTURA & IMPLEMENTACIÓN):
# - Este bloque es el único `default_server` HTTP y redirige cualquier Host no
#   reconocido al dominio HTTPS canónico, conservando ruta y query string.
#
# 📦 QUÉ (WHAT / ENTREGABLES):
# - Redirección 301 IP/host desconocido → https://baqueanonicaragua.com.
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://baqueanonicaragua.com$request_uri;
}

