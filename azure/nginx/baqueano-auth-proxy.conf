# =====================================================
# BAQUEANO — Proxy de ayudantes OAuth de Firebase
# =====================================================
#
# 🎯 POR QUÉ: Google debe presentar baqueanonicaragua.com como dominio de
# confianza y los navegadores deben mantener el flujo OAuth en el mismo origen.
# ⚙️ CÓMO: Nginx reenvía de forma transparente /__/auth/* al Hosting técnico
# de Firebase, conservando la URL canónica visible y habilitando SNI al upstream.
# 📦 QUÉ: handler, iframe y recursos auxiliares de Firebase Authentication.
# =====================================================
location ^~ /__/auth/ {
    include /etc/nginx/snippets/baqueano-security-headers.conf;
    proxy_pass https://app-baqueano.firebaseapp.com;
    proxy_set_header Host app-baqueano.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_ssl_name app-baqueano.firebaseapp.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 30s;
}
