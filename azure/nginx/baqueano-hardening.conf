# ============================================================================
# 🧭 BAQUEANO — CAPACIDAD Y DEFENSA DEL SITIO (snippet dentro del server canónico)
# ============================================================================
# 🎯 POR QUÉ (2026-10-07): prueba de carga con la configuración real de producción y 2 workers
#   (igual que la VM de 2 vCPU): comprimir con gzip en cada petición saturaba la CPU en
#   ~1 070 páginas/s, con timeouts. Además no había límites por IP ni tiempos máximos contra
#   conexiones lentas (slowloris), ni filtro para los escáneres automáticos (bots e IA ofensiva).
# ⚙️ CÓMO:
#   - gzip_static: deploy.sh precomprime HTML/CSS/JS/JSON/SVG (*.gz) y Nginx los envía sin gastar
#     CPU. Medido: 1 066 → 4 655 páginas/s, p99 1 155 → 324 ms, 0 errores.
#   - open_file_cache: evita abrir el mismo archivo en cada petición.
#   - Tiempos cortos para cabeceras/cuerpo y cierre de conexiones colgadas (slowloris).
#   - Límites por IP (zonas en baqueano-limits.conf): ráfaga amplia para no castigar a quien
#     carga la portada ni a redes compartidas; un solo origen inundando recibe 429.
#   - Escáneres: el sitio no tiene PHP/ASP/CGI ni WordPress; esas rutas responden 404 al instante.
# 📦 QUÉ: incluido por deploy.sh (ensure_include) antes de las rutas del sitio. Cambiar aquí y
#   validar con `sudo nginx -t`.
# ============================================================================
gzip_static on;
gzip_vary on;
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 20s;
keepalive_timeout 30s;
keepalive_requests 1000;
reset_timedout_connection on;
large_client_header_buffers 4 16k;

limit_conn bq_conn 300;
limit_req zone=bq_req burst=400 nodelay;


# Rutas que solo piden los escáneres automáticos: respuesta inmediata, sin tocar el disco.
location ~* (\.(php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ini|bak|sql|sh)$|/wp-(admin|login|content|includes)|/xmlrpc|/phpmyadmin|/cgi-bin/|/vendor/phpunit) {
    access_log off;
    return 404;
}
