# ============================================================================
# 🧭 BAQUEANO — ZONAS DE LÍMITE POR IP (contexto http, /etc/nginx/conf.d/)
# ============================================================================
# 🎯 POR QUÉ (2026-10-07, pedido del propietario: "que no se caiga" y seguridad contra ataques):
#   sin límites, una sola máquina podía pedir miles de páginas por segundo y gastar toda la CPU
#   de la VM (2 vCPU) que atiende a todos los visitantes.
# ⚙️ CÓMO: Nginx exige definir las zonas en el contexto http; este archivo vive en conf.d (el
#   nginx.conf de Ubuntu lo incluye ahí). Los límites se aplican en baqueano-hardening.conf.
#   Valores generosos a propósito: en Nicaragua los operadores móviles comparten una IP entre
#   muchos clientes (CGNAT) y una portada pide ~80 archivos de golpe.
# 📦 QUÉ: bq_req (50 peticiones/s por IP, ráfaga en el snippet),
#   bq_conn (conexiones simultáneas por IP). Al pasarse responde 429, sin tocar el disco.
# ============================================================================
# No revelar la versión de Nginx en ningún bloque. El de redirección http→https que crea
# Certbot no tenía server_tokens off y respondía "nginx/1.18.0 (Ubuntu)" (2026-10-07).
server_tokens off;

limit_req_zone  $binary_remote_addr zone=bq_req:20m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=bq_conn:20m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ----------------------------------------------------------------------------
# IP real del visitante detrás de Cloudflare (CDN). Solo se confía en la cabecera si la
# conexión viene de los rangos publicados por Cloudflare (https://www.cloudflare.com/ips/);
# cualquier otro origen no puede falsificarla. Sin Cloudflare delante, no cambia nada.
# Sin esto, los límites de arriba contarían a todo Cloudflare como una sola IP.
# ----------------------------------------------------------------------------
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 173.245.48.0/20;
