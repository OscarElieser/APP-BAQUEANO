# ============================================================================
# 🧭 BAQUEANO — EVIDENCIA DE PRODUCCIÓN KRONOX 2026
# ============================================================================
# 🎯 POR QUÉ: el jurado exige evidencia verificable (no capturas editables) de
#   que producción sirve el commit de main, con HTTPS/TLS válido, cabeceras de
#   seguridad, perímetro cerrado, páginas críticas, SEO/PWA y RLS efectiva.
#   El job de verificación del despliegue se detiene si /health no coincide;
#   este workflow registra TODOS los controles aunque alguno falle.
# ⚙️ CÓMO: tools/kronox-prod-evidence.mjs desde un runner de GitHub (fuera de la
#   VM). Resultado en el resumen del job y como artefacto JSON + Markdown.
# 📦 QUÉ: manual (workflow_dispatch), diario y al TERMINAR con éxito el despliegue de producción.
# ⏱️ 2026-10-14: antes corría en cada push, al mismo tiempo que el despliegue, y comparaba
#   /health con un commit que todavía no estaba publicado: fallaba siempre en el push aunque
#   todo estuviera bien. Ahora espera al workflow «🚀 BAQUEANO Producción (Azure)» y verifica
#   el commit que ese despliegue publicó. Si el despliegue falla, el rojo queda en su propio
#   workflow (no se oculta nada) y el control diario sigue registrando el estado real.
# ============================================================================
name: 🧪 Evidencia de producción (Kronox 2026)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  workflow_run:
    workflows: ['🚀 BAQUEANO Producción (Azure)']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kronox-evidence
  cancel-in-progress: true

jobs:
  evidence:
    name: Controles en vivo de producción
    # Manual, siempre. Tras un despliegue (si terminó bien) y a diario, solo mientras
    # producción se publique por este pipeline (DEPLOY_TARGET=azure). 2026-10-15: el
    # propietario retira Azure y publica en Hostinger/Cloudflare; el control en vivo se
    # corre a mano (Run workflow) hasta conectar la nueva publicación.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_TARGET == 'azure' &&
       (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar controles (no se detiene en el primer fallo)
        # Tras un despliegue se compara con el commit que ese despliegue publicó.
        run: node tools/kronox-prod-evidence.mjs --expected="${{ github.event.workflow_run.head_sha || github.sha }}" --out=kronox-evidence
      - name: Publicar evidencia como artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kronox-prod-evidence-${{ github.run_number }}
          path: kronox-evidence/
          retention-days: 90
