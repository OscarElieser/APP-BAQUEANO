# =====================================================
# BAQUEANO — Despliegue continuo a producción
# =====================================================
#
# PROPÓSITO:
#   Cada push a main actualiza la página sin pasos manuales y deja evidencia
#   pública (pestaña Actions) de que producción = GitHub (Sprint 3).
#
# ARQUITECTURA:
#   1. checks          → valida scripts de Azure y la API (sintaxis).
#   1b. browser-qa     → Playwright + axe sobre el build: 28 páginas × 16 anchos
#                        (responsive, WCAG 2.2 AA, cajón móvil, WhatsApp). Bloquea Firebase.
#   2. verify-azure    → la VM se actualiza SOLA (azure/autodeploy.sh, cada
#                        2 min, modelo pull). Este job espera a que
#                        https://baqueanonicaragua.com/health muestre el commit
#                        subido y verifica API, Supabase y cabeceras.
#   3. firebase-hosting→ EN PAUSA (propietario, 2026-10-05): el sitio público vive
#                        solo en baqueanonicaragua.com. El job queda comentado al
#                        final para reactivarlo en el futuro (ver firebase.legacy.json).
#
# SEGURIDAD:
#   - GitHub no tiene acceso SSH a la VM (sin claves del servidor en GitHub).
#   - Permisos mínimos del GITHUB_TOKEN (contents: read).
#   - Solo un despliegue a la vez (concurrency).
#
# RELACIÓN: azure/autodeploy.sh, azure/deploy.sh, docs/deployment/AZURE_DEPLOYMENT.md.
# =====================================================
name: 🚀 BAQUEANO Producción (Azure)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: ✅ Validación de scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis de scripts Azure (bash -n)
        run: for f in azure/*.sh; do bash -n "$f"; done
      - name: Sintaxis de la API Azure (node --check)
        run: node --check azure/api/server.js
      - name: Pruebas de la API Azure
        run: npm --prefix azure/api test
      - name: APK Android presente y no vacío
        run: test -s website/assets/BaqueanoNicaragua.apk
      - name: Regla "Franja viva de lugares" (17 territorios con franja y ficha)
        working-directory: website
        run: node scripts/territory-places-rule.test.mjs
      - name: Paridad Web → APK (territorios y lugares idénticos en la app)
        working-directory: website
        run: node scripts/export-territories-for-app.mjs --check
      - name: Puerta i18n (6 idiomas, claves existentes, sin texto nuevo sin traducir)
        working-directory: website
        run: node scripts/validate-i18n.mjs && node scripts/i18n-audit.mjs
      - name: Paridad Web → APK (6 idiomas, mismas traducciones)
        working-directory: website
        run: node scripts/export-locales-for-app.mjs --check
      - name: Build estático del Website (misma lista permitida que producción)
        working-directory: website
        run: node scripts/build-hostinger-static.mjs
      - name: SEO del dominio oficial (canonical, hreflang ×6, manifest, JSON-LD, sitemap)
        working-directory: website
        run: |
          node scripts/seo-normalize.test.mjs
          grep -q 'Sitemap: https://baqueanonicaragua.com/sitemap.xml' dist-hostinger/robots.txt
          ! grep -q 'web.app' dist-hostinger/sitemap.xml
      - name: Auditoría 20/20 de la salida publicada (metadatos, OG, JSON-LD, favicon, ALT, enlaces, robots, sitemap)
        working-directory: website
        run: node scripts/production-audit.mjs --out=../docs/production-audit
      - name: Evidencia Kronox al día (documentos generados = fuente única)
        run: node tools/kronox/gen-development-docs.mjs --check

  browser-qa:
    # Requisitos 10, 13, 14, 15, 16 y 18 del checklist 20/20, medidos en un navegador
    # real: 28 páginas × 16 anchos (320–2560 px), sin desborde horizontal, axe WCAG 2.2 AA
    # sin violaciones críticas ni graves, cajón móvil desplazable, WhatsApp seguro.
    name: 🧪 QA en navegador (responsive + accesibilidad)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Herramientas de prueba aisladas (Playwright + axe-core, sin tocar dependencias del sitio)
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          npm --prefix "$RUNNER_TEMP/qa" install --no-audit --no-fund @playwright/test@1.63.0 axe-core@4
          ln -s "$RUNNER_TEMP/qa/node_modules" website/node_modules
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build estático del Website
        working-directory: website
        run: node scripts/build-hostinger-static.mjs
      - name: QA en navegador sobre la salida publicada
        working-directory: website
        env:
          BASE_URL: http://127.0.0.1:8790/
          QA_WORKERS: '4'
        run: |
          python3 -m http.server 8790 --bind 127.0.0.1 --directory dist-hostinger >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8790/index.html && break; sleep 1; done
          node scripts/browser-qa.mjs
      - name: Evidencia (browser-qa.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: docs/production-audit/browser-qa.json
          if-no-files-found: ignore

  verify-azure:
    name: ☁️ Verificar despliegue en Azure
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://baqueanonicaragua.com
    steps:
      # tools/verify-sprints.mjs vive en el repo: sin checkout el paso de
      # evidencia fallaba con MODULE_NOT_FOUND aunque producción estuviera bien.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Esperar a que /health sirva este commit (autodeploy cada 2 min)
        run: |
          short="${GITHUB_SHA::7}"
          for i in $(seq 1 40); do
            deployed="$(curl -fsS --max-time 10 "$SITE/health" | sed -nE 's/.*"commit":"([0-9a-f]+)".*/\1/p' || true)"
            echo "Intento $i: producción=${deployed:-?} · esperado=${short}"
            if [[ -n "$deployed" && "$short" == "$deployed"* ]]; then
              echo "✅ Producción sirve el commit ${short}"; exit 0
            fi
            sleep 20
          done
          echo "::error::Producción no sirvió ${short} en 13 minutos. Revise en la VM: journalctl -u baqueano-autodeploy -n 100"
          exit 1
      - name: API Azure y conexión con Supabase
        # Corre aunque /health no coincida: la evidencia de seguridad no debe
        # quedar oculta por un fallo de despliegue en la VM.
        if: ${{ !cancelled() }}
        run: |
          curl -fsS --max-time 15 "$SITE/api/azure/health"; echo
          body="$(curl -fsS --max-time 20 "$SITE/api/azure/db")"; echo "$body"
          echo "$body" | grep -q '"provider":"supabase-postgresql","ok":true' || { echo "::error::Supabase no respondió desde Azure"; exit 1; }
      - name: Evidencia Sprint 1–3 completa
        # Corre aunque /health no coincida: la evidencia de seguridad no debe
        # quedar oculta por un fallo de despliegue en la VM.
        if: ${{ !cancelled() }}
        run: node tools/verify-sprints.mjs --commit="${GITHUB_SHA::7}"
      - name: Pruebas negativas en vivo (RBAC y RLS)
        # Corre aunque /health no coincida: la evidencia de seguridad no debe
        # quedar oculta por un fallo de despliegue en la VM.
        if: ${{ !cancelled() }}
        # Clave publicable: es pública por diseño (va en el sitio). Demuestra que
        # sin sesión o con token falso no se modera ni se leen tablas de servidor.
        env:
          FN: https://heiudfpthqwtjrtluqlm.supabase.co/functions/v1/baqueano-community
          REST: https://heiudfpthqwtjrtluqlm.supabase.co/rest/v1
          ANON: sb_publishable_q7ZhqRIRjlerZK7WOu_Qxw_X_AqXV1d
        run: |
          expect() { # $1 descripción, $2 código esperado (regex), resto: curl
            local desc="$1" want="$2"; shift 2
            local code; code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@")"
            if [[ "$code" =~ ^($want)$ ]]; then echo "✅ $desc → $code"; else echo "::error::$desc → $code (esperado $want)"; exit 1; fi
          }
          expect "whoami sin sesión" 401 -X POST "$FN" -H 'content-type: application/json' -d '{"action":"whoami"}'
          expect "mod_queue sin sesión" 401 -X POST "$FN" -H 'content-type: application/json' -d '{"action":"mod_queue"}'
          expect "mod_queue con token falso" 401 -X POST "$FN" -H 'content-type: application/json' -H 'x-firebase-token: falso.token.firma' -d '{"action":"mod_queue"}'
          expect "moderate sin sesión" 401 -X POST "$FN" -H 'content-type: application/json' -d '{"action":"moderate","id":"00000000-0000-0000-0000-000000000000","status":"published"}'
          OPS=https://heiudfpthqwtjrtluqlm.supabase.co/functions/v1/baqueano-ops
          expect "ops overview sin sesión" 401 -X POST "$OPS" -H 'content-type: application/json' -d '{"action":"overview"}'
          expect "ops save con token falso" 401 -X POST "$OPS" -H 'content-type: application/json' -H 'x-firebase-token: falso.token.firma' -d '{"action":"save","entity":"destinations","values":{"name":"x"}}'
          expect "ops audit_list sin sesión" 401 -X POST "$OPS" -H 'content-type: application/json' -d '{"action":"audit_list"}'
          SOS=https://heiudfpthqwtjrtluqlm.supabase.co/functions/v1/baqueano-sos
          expect "sos report sin sesión" 401 -X POST "$SOS" -H 'content-type: application/json' -d '{"action":"report","latitude":12.1,"longitude":-86.2}'
          expect "sos queue con token falso" 401 -X POST "$SOS" -H 'content-type: application/json' -H 'x-firebase-token: falso.token.firma' -d '{"action":"queue"}'
          expect "sos update sin sesión" 401 -X POST "$SOS" -H 'content-type: application/json' -d '{"action":"update","id":"00000000-0000-0000-0000-000000000000","status":"resolved"}'
          RES=https://heiudfpthqwtjrtluqlm.supabase.co/functions/v1/baqueano-reservas
          expect "reservas create sin sesión" 401 -X POST "$RES" -H 'content-type: application/json' -d '{"action":"create","business_id":"biz-coop-somoto","travel_date":"2030-01-01","people_count":2,"contact_phone":"88888888"}'
          expect "reservas queue con token falso" 401 -X POST "$RES" -H 'content-type: application/json' -H 'x-firebase-token: falso.token.firma' -d '{"action":"queue"}'
          expect "reservas update sin sesión" 401 -X POST "$RES" -H 'content-type: application/json' -d '{"action":"update","id":"00000000-0000-0000-0000-000000000000","status":"confirmed"}'
          IDN=https://heiudfpthqwtjrtluqlm.supabase.co/functions/v1/baqueano-identity
          expect "identity list sin sesión" 401 -X POST "$IDN" -H 'content-type: application/json' -d '{"action":"list"}'
          expect "identity set_role con token falso" 401 -X POST "$IDN" -H 'content-type: application/json' -H 'x-firebase-token: falso.token.firma' -d '{"action":"set_role","id":"00000000-0000-0000-0000-000000000000","role":"superadmin","reason":"x"}'
          expect "identity invite con JWT falso" 401 -X POST "$IDN" -H 'content-type: application/json' -H 'authorization: Bearer a.b.c' -d '{"action":"invite","email":"x@example.com","role":"admin"}'
          expect "lista pública de experiencias" 200 -X POST "$FN" -H 'content-type: application/json' -d '{"action":"list"}'
          # Cierre de tablas sensibles: se lee la postura efectiva (privilegios + RLS)
          # en vez de provocar denegaciones, que llenaban los logs de Supabase de
          # errores 42501 (migración 20261005095000_security_posture.sql).
          posture="$(curl -s --max-time 20 -X POST "$REST/rpc/security_posture" -H "apikey: $ANON" -H 'content-type: application/json' -d '{}')"
          echo "$posture" | jq -e '.relations' >/dev/null || { echo "::error::security_posture no disponible: ${posture:0:200}"; exit 1; }
          for t in staff_roles audit_logs ops_backup_entities profiles reservations sos_events user_roles admin_user_directory identity_links business_members; do
            if echo "$posture" | jq -e --arg t "$t" '.relations[$t] | (.exists | not) or (.anon_select == false and .anon_insert == false)' >/dev/null; then
              echo "✅ anon sin privilegios sobre $t"
            elif echo "$posture" | jq -e --arg t "$t" '.relations[$t] | .rls == true and .anon_insert == false' >/dev/null; then
              # Protegida por RLS (no por privilegio): la lectura responde 200 sin filas y no deja error en los logs.
              body="$(curl -s --max-time 20 "$REST/$t?select=*&limit=1" -H "apikey: $ANON")"
              if [[ "$body" == "[]" ]]; then echo "✅ RLS: anon no ve filas de $t"; else echo "::error::anon ve filas de $t"; exit 1; fi
            else echo "::error::anon tiene privilegios sobre $t sin RLS"; exit 1; fi
          done
      - name: Cabeceras de seguridad y redirecciones
        # Corre aunque /health no coincida: la evidencia de seguridad no debe
        # quedar oculta por un fallo de despliegue en la VM.
        if: ${{ !cancelled() }}
        run: |
          headers="$(curl -fsSI --max-time 15 "$SITE/")"
          for h in content-security-policy strict-transport-security x-frame-options x-content-type-options; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::Falta la cabecera $h"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://baqueanonicaragua.com/)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/README.md")" = "404"
          echo "✅ Cabeceras, redirección HTTPS y bloqueo de archivos internos correctos"

