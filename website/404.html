<!DOCTYPE html>
<!--
============================================================================
🧭 BAQUEANO ECOSYSTEM — PÁGINA 404 (ERROR DE RUTA NO ENCONTRADA)
============================================================================

🎯 1. POR QUÉ (WHY / PROPÓSITO):
- Proporcionar una experiencia de error digna y coherente con la identidad
  BAQUEANO cuando un explorador llega a una ruta inexistente.
- Evitar que el visitante abandone el sitio por no encontrar la ruta:
  redirigirlo hacia el contenido de valor real.
- NO exponer stack traces, rutas internas ni información de infraestructura.

⚙️ 2. CÓMO (HOW / ARQUITECTURA & IMPLEMENTACIÓN):
- Página estática independiente, configurada en firebase.json como 404.
- Conserva la identidad visual completa: colores, tipografía y paleta oficial.
- CTA claro hacia Home y Destinos para recuperar la navegación.

📦 3. QUÉ (WHAT / COMPONENTES):
- Mensaje de error amigable con contexto de exploración.
- Dos botones de acción: volver al inicio o explorar destinos.
- Animación SVG de brújula desorientada.
============================================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta No Encontrada | Baqueano Nicaragua</title>
  <meta name="description" content="La ruta que buscas no existe en el ecosistema Baqueano. Vuelve al inicio o explora nuestros destinos.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://app-baqueano.web.app/">
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --petroleo-teal: #165D6F;
      --terracotta: #F65E01;
      --arena-pinolera: #F4E6C1;
      --noche-profunda: #0F172A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--noche-profunda);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(22, 93, 111, 0.12) 0%, transparent 60%);
      pointer-events: none;
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .error-container {
      max-width: 560px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .compass-wrapper {
      margin-bottom: 2rem;
      animation: compassSpin 6s ease-in-out infinite;
    }

    @keyframes compassSpin {
      0%, 100% { transform: rotate(-15deg); }
      25% { transform: rotate(20deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(15deg); }
    }

    .compass-icon {
      font-size: 5rem;
      color: var(--petroleo-teal);
      opacity: 0.8;
    }

    .error-code {
      font-family: 'Montserrat', sans-serif;
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #165D6F 0%, #F65E01 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1rem;
      color: rgba(244, 230, 193, 0.7);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .error-message strong {
      color: var(--arena-pinolera);
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      background: linear-gradient(135deg, #165D6F 0%, #0e8fa3 100%);
      border: none;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(22, 93, 111, 0.4);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      background: transparent;
      border: 1px solid rgba(246, 94, 1, 0.4);
      border-radius: 12px;
      color: var(--terracotta);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: rgba(246, 94, 1, 0.1);
      border-color: var(--terracotta);
      transform: translateY(-3px);
    }

    .brand-footer {
      margin-top: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      opacity: 0.5;
      font-size: 0.85rem;
    }

    .brand-footer img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="compass-wrapper">
      <i class="fa-solid fa-compass compass-icon"></i>
    </div>

    <div class="error-code">404</div>

    <div class="error-title">Sendero No Encontrado</div>

    <p class="error-message">
      La ruta que buscas no existe en el ecosistema <strong>Baqueano Nicaragua</strong>.<br>
      Pero hay muchos senderos por explorar — ¡ninguno en el mapa oficial todavía!
    </p>

    <div class="error-actions">
      <a href="/" class="btn-primary">
        <i class="fa-solid fa-house"></i> Volver al Inicio
      </a>
      <a href="/destinos.html" class="btn-secondary">
        <i class="fa-solid fa-compass"></i> Explorar Destinos
      </a>
    </div>

    <div class="brand-footer">
      <img src="assets/images/logo.png" alt="Baqueano">
      <span>BAQUEANO NICARAGUA — Descubre lo que no sale en el mapa.</span>
    </div>
  </div>

</body>
</html>
