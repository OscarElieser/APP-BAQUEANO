[functions.baqueano-intake]
# Autenticación propia: Firebase opcional (jose + JWKS), origen permitido y límites por IP.
enabled = true
verify_jwt = false
import_map = "./functions/baqueano-intake/deno.json"
entrypoint = "./functions/baqueano-intake/index.ts"

[functions.baqueano-presence]
# Presencia operativa: heartbeat público (origen web permitido o Android) y snapshot solo para el equipo.
enabled = true
verify_jwt = false
import_map = "./functions/baqueano-presence/deno.json"
entrypoint = "./functions/baqueano-presence/index.ts"

[functions.baqueano-notifications]
# Centro de notificaciones: token de Firebase verificado; cada persona solo ve las suyas.
enabled = true
verify_jwt = false
import_map = "./functions/baqueano-notifications/deno.json"
entrypoint = "./functions/baqueano-notifications/index.ts"
