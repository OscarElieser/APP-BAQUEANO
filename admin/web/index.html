<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Centro de Control y Gestión Web de BAQUEANO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Baqueano Admin">
  <title>Baqueano Admin · Centro de Control</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    body {
      background-color: #082B35;
      margin: 0;
      color: #FFFFFF;
      font-family: 'Space Grotesk', sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-weight: 700; letter-spacing: 1px; color: #D4AF37;">BAQUEANO ADMIN · INICIANDO SISTEMA</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
